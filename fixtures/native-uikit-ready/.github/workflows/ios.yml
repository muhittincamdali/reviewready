name: iOS

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - run: xcodebuild -project Atlas.xcodeproj -scheme Atlas -destination 'generic/platform=iOS Simulator' build
