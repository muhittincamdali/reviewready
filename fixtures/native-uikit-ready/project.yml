name: Atlas
options:
  bundleIdPrefix: dev.reviewready.fixtures
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Atlas:
    type: application
    platform: iOS
    sources:
      - Atlas
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reviewready.fixtures.atlas
        INFOPLIST_FILE: Atlas/Info.plist
        CODE_SIGN_ENTITLEMENTS: Atlas/Atlas.entitlements
