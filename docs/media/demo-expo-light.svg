<text class="t" x="20" y="105" style="animation-delay:2.83s"><tspan fill="#5A6B80">reviewready 0.1.0 · rules app-review@2026.10.28 (sources read 2026-10-28)</tspan></text>
<text class="t" x="20" y="124" style="animation-delay:2.87s"></text>
<text class="t" x="20" y="143" style="animation-delay:2.90s"><tspan fill="#00285C" font-weight="700">field-notes</tspan><tspan fill="#0B1F33"> · Expo · fixtures/expo-58-camera</tspan></text>
<text class="t" x="20" y="162" style="animation-delay:2.94s"><tspan fill="#5A6B80">Xcode 16.4 pinned</tspan></text>
<text class="t" x="20" y="181" style="animation-delay:2.98s"><tspan fill="#5A6B80">react-native 0.88.0 (declared)</tspan></text>
<text class="t" x="20" y="200" style="animation-delay:3.01s"><tspan fill="#5A6B80">expo 58.0.20 (declared)</tspan></text>
<text class="t" x="20" y="219" style="animation-delay:3.04s"><tspan fill="#5A6B80">target field-notes</tspan></text>
<text class="t" x="20" y="238" style="animation-delay:3.08s"></text>
<text class="t" x="20" y="257" style="animation-delay:3.12s"><tspan fill="#00285C" font-weight="700">2 problems App Review or App Store Connect turns away, and 2 warnings to review</tspan></text>
<text class="t" x="20" y="276" style="animation-delay:3.15s"></text>
<text class="t" x="20" y="295" style="animation-delay:3.19s"><tspan fill="#00285C" font-weight="700">ERROR    </tspan><tspan fill="#00285C" font-weight="700">RVW101 Purpose string missing</tspan></text>
<text class="t" x="20" y="314" style="animation-delay:3.22s"><tspan fill="#0B1F33">         </tspan><tspan fill="#0058D4">app.json</tspan></text>
<text class="t" x="20" y="333" style="animation-delay:3.25s"><tspan fill="#0B1F33">         The expo-tracking-transparency package (its config plugin is not in expo.plugins) needs</tspan></text>
<text class="t" x="20" y="352" style="animation-delay:3.29s"><tspan fill="#0B1F33">         NSUserTrackingUsageDescription (App Tracking Transparency); field-notes has none.</tspan></text>
<text class="t" x="20" y="371" style="animation-delay:3.33s"></text>
<text class="t" x="20" y="390" style="animation-delay:3.36s"><tspan fill="#00285C" font-weight="700">ERROR    </tspan><tspan fill="#00285C" font-weight="700">RVW601 Xcode older than App Store Connect accepts</tspan></text>
<text class="t" x="20" y="409" style="animation-delay:3.40s"><tspan fill="#0B1F33">         </tspan><tspan fill="#0058D4">eas.json:8</tspan></text>
<text class="t" x="20" y="428" style="animation-delay:3.43s"><tspan fill="#0B1F33">         eas.json pins Xcode 16.4 (EAS image); App Store Connect accepts uploads built with Xcode 26</tspan></text>
<text class="t" x="20" y="447" style="animation-delay:3.46s"><tspan fill="#0B1F33">         or later since 28 April 2026.</tspan></text>
<text class="t" x="20" y="466" style="animation-delay:3.50s"></text>
<text class="t" x="20" y="485" style="animation-delay:3.54s"><tspan fill="#0058D4" font-weight="700">WARNING  </tspan><tspan fill="#00285C" font-weight="700">RVW104 Purpose string is placeholder or default text</tspan></text>
<text class="t" x="20" y="504" style="animation-delay:3.57s"><tspan fill="#0B1F33">         </tspan><tspan fill="#0058D4">app.json</tspan></text>
<text class="t" x="20" y="523" style="animation-delay:3.60s"><tspan fill="#0B1F33">         The expo-location config plugin writes its default text for</tspan></text>
<text class="t" x="20" y="542" style="animation-delay:3.64s"><tspan fill="#0B1F33">         NSLocationWhenInUseUsageDescription, NSLocationAlwaysAndWhenInUseUsageDescription,</tspan></text>
<text class="t" x="20" y="561" style="animation-delay:3.67s"><tspan fill="#0B1F33">         NSLocationAlwaysUsageDescription: no option or ios.infoPlist value gives the app's own.</tspan></text>
<text class="t" x="20" y="580" style="animation-delay:3.71s"></text>
<text class="t" x="20" y="599" style="animation-delay:3.75s"><tspan fill="#0058D4" font-weight="700">WARNING  </tspan><tspan fill="#00285C" font-weight="700">RVW701 No privacy manifest</tspan></text>
<text class="t" x="20" y="618" style="animation-delay:3.78s"><tspan fill="#0B1F33">         </tspan><tspan fill="#0058D4">app.json</tspan></text>
<text class="t" x="20" y="637" style="animation-delay:3.81s"><tspan fill="#0B1F33">         app.json has no ios.privacyManifests, so prebuild writes no privacy manifest for the app.</tspan></text>
<text class="t" x="20" y="656" style="animation-delay:3.85s"></text>
<text class="t" x="20" y="675" style="animation-delay:3.88s"><tspan fill="#00285C" font-weight="700">2 errors, 2 warnings, 9 checks passed</tspan></text>
<text class="t" x="20" y="694" style="animation-delay:3.92s"><tspan fill="#5A6B80">Run it without --brief for the fix and source of each finding.</tspan></text>
<text class="t" x="20" y="713" style="animation-delay:4.16s"><tspan fill="#0071E3" font-weight="700">$ </tspan></text>
