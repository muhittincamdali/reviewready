<text class="t" x="20" y="466" style="animation-delay:3.90s"><tspan fill="#D0E2F7">         The App Store icon has an alpha channel.</tspan></text>
<text class="t" x="20" y="485" style="animation-delay:3.94s"></text>
<text class="t" x="20" y="504" style="animation-delay:3.97s"><tspan fill="#FFFFFF" font-weight="700">ERROR    </tspan><tspan fill="#FFFFFF" font-weight="700">RVW601 Xcode older than App Store Connect accepts</tspan></text>
