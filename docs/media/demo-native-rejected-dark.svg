<text class="t" x="20" y="257" style="animation-delay:3.52s"><tspan fill="#FFFFFF" font-weight="700">ERROR    </tspan><tspan fill="#FFFFFF" font-weight="700">RVW101 Purpose string missing</tspan></text>
