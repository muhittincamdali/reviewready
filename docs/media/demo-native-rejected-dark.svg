<text class="t" x="20" y="713" style="animation-delay:4.36s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#4DA3FF">Ledger.xcodeproj/project.pbxproj:156</tspan></text>
<text class="t" x="20" y="732" style="animation-delay:4.39s"><tspan fill="#D0E2F7">         NSLocationWhenInUseUsageDescription "Location placeholder" contains the placeholder</tspan></text>
<text class="t" x="20" y="751" style="animation-delay:4.43s"><tspan fill="#D0E2F7">         "placeholder".</tspan></text>
<text class="t" x="20" y="770" style="animation-delay:4.46s"></text>
<text class="t" x="20" y="789" style="animation-delay:4.50s"><tspan fill="#8CC4FF" font-weight="700">WARNING  </tspan><tspan fill="#FFFFFF" font-weight="700">RVW201 Export compliance not declared</tspan></text>
<text class="t" x="20" y="808" style="animation-delay:4.54s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#4DA3FF">Ledger.xcodeproj/project.pbxproj</tspan></text>
<text class="t" x="20" y="827" style="animation-delay:4.57s"><tspan fill="#D0E2F7">         The Info.plist of Ledger has no ITSAppUsesNonExemptEncryption, so App Store Connect asks</tspan></text>
<text class="t" x="20" y="846" style="animation-delay:4.61s"><tspan fill="#D0E2F7">         the export compliance questions for every build.</tspan></text>
<text class="t" x="20" y="865" style="animation-delay:4.64s"></text>
<text class="t" x="20" y="884" style="animation-delay:4.67s"><tspan fill="#8CC4FF" font-weight="700">WARNING  </tspan><tspan fill="#FFFFFF" font-weight="700">RVW301 Account creation without account deletion</tspan></text>
<text class="t" x="20" y="903" style="animation-delay:4.71s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#4DA3FF">Ledger/SignUpView.swift:13</tspan></text>
<text class="t" x="20" y="922" style="animation-delay:4.75s"><tspan fill="#D0E2F7">         Accounts are created (a createUser(withEmail:) call in Ledger/SignUpView.swift:13), and no</tspan></text>
<text class="t" x="20" y="941" style="animation-delay:4.78s"><tspan fill="#D0E2F7">         account deletion call or "Delete account" text was found in the app's code or strings.</tspan></text>
<text class="t" x="20" y="960" style="animation-delay:4.81s"></text>
<text class="t" x="20" y="979" style="animation-delay:4.85s"><tspan fill="#8CC4FF" font-weight="700">WARNING  </tspan><tspan fill="#FFFFFF" font-weight="700">RVW401 Third-party login without an equivalent option</tspan></text>
<text class="t" x="20" y="998" style="animation-delay:4.88s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#4DA3FF">Ledger/SignUpView.swift:1</tspan></text>
<text class="t" x="20" y="1017" style="animation-delay:4.92s"><tspan fill="#D0E2F7">         Google Sign-In is used (import GoogleSignIn in Ledger/SignUpView.swift:1), and no Sign in</tspan></text>
<text class="t" x="20" y="1036" style="animation-delay:4.96s"><tspan fill="#D0E2F7">         with Apple was found: no package, entitlement or AuthenticationServices call.</tspan></text>
<text class="t" x="20" y="1055" style="animation-delay:4.99s"></text>
<text class="t" x="20" y="1074" style="animation-delay:5.03s"><tspan fill="#8CC4FF" font-weight="700">WARNING  </tspan><tspan fill="#FFFFFF" font-weight="700">RVW702 Privacy manifest not in the app</tspan></text>
<text class="t" x="20" y="1093" style="animation-delay:5.06s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#4DA3FF">Ledger/PrivacyInfo.xcprivacy</tspan></text>
<text class="t" x="20" y="1112" style="animation-delay:5.09s"><tspan fill="#D0E2F7">         Ledger/PrivacyInfo.xcprivacy is not in the Copy Bundle Resources of Ledger or in a folder</tspan></text>
<text class="t" x="20" y="1131" style="animation-delay:5.13s"><tspan fill="#D0E2F7">         it syncs, so the app ships without it.</tspan></text>
<text class="t" x="20" y="1150" style="animation-delay:5.17s"></text>
<text class="t" x="20" y="1169" style="animation-delay:5.20s"><tspan fill="#FFFFFF" font-weight="700">5 errors, 5 warnings, 4 checks passed</tspan></text>
<text class="t" x="20" y="1188" style="animation-delay:5.23s"><tspan fill="#8FA3BC">Run it without --brief for the fix and source of each finding.</tspan></text>
