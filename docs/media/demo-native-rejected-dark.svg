<text class="t" x="20" y="143" style="animation-delay:3.31s"><tspan fill="#FFFFFF" font-weight="700">Ledger</tspan><tspan fill="#D0E2F7"> · native iOS · fixtures/native-swiftui-rejected</tspan></text>
