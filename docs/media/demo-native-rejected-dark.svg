<text class="t" x="20" y="599" style="animation-delay:4.15s"><tspan fill="#FFFFFF" font-weight="700">ERROR    </tspan><tspan fill="#FFFFFF" font-weight="700">RVW602 Deployment target below iOS 13</tspan></text>
<text class="t" x="20" y="618" style="animation-delay:4.18s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#4DA3FF">Ledger.xcodeproj/project.pbxproj:216</tspan></text>
