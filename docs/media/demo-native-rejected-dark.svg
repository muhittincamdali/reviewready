<text class="t" x="20" y="390" style="animation-delay:3.76s"><tspan fill="#D0E2F7">         NSPhotoLibraryUsageDescription is empty.</tspan></text>
<text class="t" x="20" y="409" style="animation-delay:3.80s"></text>
<text class="t" x="20" y="428" style="animation-delay:3.83s"><tspan fill="#FFFFFF" font-weight="700">ERROR    </tspan><tspan fill="#FFFFFF" font-weight="700">RVW503 App Store icon has an alpha channel</tspan></text>
