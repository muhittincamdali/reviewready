name: Probe
options:
  bundleIdPrefix: dev.reviewready.simulator
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Probe:
    type: application
    platform: iOS
    sources:
      - path: Probe
        excludes:
          - PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reviewready.simulator.probe
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Probe
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
